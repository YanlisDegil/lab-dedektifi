  <line x1="50" y1="47" x2="50" y2="70" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="70" x2="62" y2="70" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="65" y2="45" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Atom orbits -->
  <ellipse cx="50" cy="35" rx="18" ry="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" transform="rotate(30 50 35)"/>
  <ellipse cx="50" cy="35" rx="18" ry="6" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" transform="rotate(-30 50 35)"/>
