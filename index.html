<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Bilim Laboratuvarı</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (Tarayıcıda JSX Derlemek İçin) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-950 text-white m-0 p-0 overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect } = React;

    // Element Verisi
    const elements = [
      { z: 1, symbol: 'H', name: 'Hidrojen', color: '#10b981', shells: [1] },
      { z: 2, symbol: 'He', name: 'Helyum', color: '#38bdf8', shells: [2] },
      { z: 3, symbol: 'Li', name: 'Lityum', color: '#f43f5e', shells: [2, 1] },
      { z: 4, symbol: 'Be', name: 'Berilyum', color: '#fbbf24', shells: [2, 2] },
      { z: 5, symbol: 'B', name: 'Bor', color: '#a855f7', shells: [2, 3] },
      { z: 6, symbol: 'C', name: 'Karbon', color: '#ffffff', shells: [2, 4] },
      { z: 7, symbol: 'N', name: 'Azot', color: '#3b82f6', shells: [2, 5] },
      { z: 8, symbol: 'O', name: 'Oksijen', color: '#ef4444', shells: [2, 6] },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('lab');
      const [selectedZ, setSelectedZ] = useState(1);
      const canvasRef = useRef(null);

      const selectedElement = useMemo(
        () => elements.find((e) => e.z === selectedZ) || elements[0],
        [selectedZ]
      );

      // WebGL / Three.js Sahne Kurulumu
      useEffect(() => {
        const container = canvasRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#020617');

        const camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.innerHTML = '';
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 8, 5);
        scene.add(dirLight);

        let activeMeshGroup = new THREE.Group();
        scene.add(activeMeshGroup);

        // Sekmelere göre 3D Obje Oluşturma
        if (activeTab === 'lab') {
          // Masa
          const benchGeo = new THREE.BoxGeometry(10, 0.4, 5);
          const benchMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.35 });
          const bench = new THREE.Mesh(benchGeo, benchMat);
          bench.position.set(0, -1.8, 0);
          activeMeshGroup.add(bench);

          // Beher
          const beakerGeo = new THREE.CylinderGeometry(0.65, 0.65, 1.5, 32, 1, true);
          const beakerMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
          const beaker = new THREE.Mesh(beakerGeo, beakerMat);
          beaker.position.set(-1.5, -0.6, 0);
          activeMeshGroup.add(beaker);

          // Beher İçi Sıvı
          const liquidGeo = new THREE.CylinderGeometry(0.6, 0.6, 1.0, 32);
          const liquidMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.2 });
          const liquid = new THREE.Mesh(liquidGeo, liquidMat);
          liquid.position.set(-1.5, -0.8, 0);
          activeMeshGroup.add(liquid);

          // pH Metre
          const meterGeo = new THREE.BoxGeometry(1.0, 1.2, 0.35);
          const meterMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
          const meter = new THREE.Mesh(meterGeo, meterMat);
          meter.position.set(1.5, -0.7, 0);
          activeMeshGroup.add(meter);

        } else if (activeTab === 'atom') {
          // Çekirdek
          const coreGeo = new THREE.SphereGeometry(0.5, 32, 32);
          const coreMat = new THREE.MeshStandardMaterial({ color: selectedElement.color, emissive: selectedElement.color, emissiveIntensity: 0.6 });
          const core = new THREE.Mesh(coreGeo, coreMat);
          activeMeshGroup.add(core);

          // Elektron Katmanları
          selectedElement.shells.forEach((count, idx) => {
            const radius = 1.2 + idx * 0.8;
            const ringGeo = new THREE.TorusGeometry(radius, 0.02, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2;
            activeMeshGroup.add(ring);
          });

        } else if (activeTab === 'earth') {
          // Dünya Küresi
          const earthGeo = new THREE.SphereGeometry(1.5, 32, 32);
          const earthMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
          const earth = new THREE.Mesh(earthGeo, earthMat);
          activeMeshGroup.add(earth);

          // Kutup Işıkları
          const auroraGeo = new THREE.TorusGeometry(0.45, 0.08, 16, 32);
          const auroraMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x10b981, emissiveIntensity: 2.0, transparent: true, opacity: 0.8 });
          const aurora = new THREE.Mesh(auroraGeo, auroraMat);
          aurora.position.set(0, 1.45, 0);
          aurora.rotation.x = Math.PI / 2;
          activeMeshGroup.add(aurora);

        } else if (activeTab === 'nucleus') {
          // Hücre Çekirdeği
          const nucGeo = new THREE.SphereGeometry(1.8, 32, 32, 0, Math.PI * 1.5);
          const nucMat = new THREE.MeshStandardMaterial({ color: 0x4338ca, roughness: 0.4, side: THREE.DoubleSide });
          const nuc = new THREE.Mesh(nucGeo, nucMat);
          activeMeshGroup.add(nuc);

          const innerGeo = new THREE.SphereGeometry(0.7, 32, 32);
          const innerMat = new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x6d28d9, emissiveIntensity: 1.0 });
          const inner = new THREE.Mesh(innerGeo, innerMat);
          activeMeshGroup.add(inner);
        }

        // Animasyon Döngüsü
        let animationFrameId;
        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          activeMeshGroup.rotation.y += 0.005;
          renderer.render(scene, camera);
        };
        animate();

        // Pencere Boyutu Değişimi
        const handleResize = () => {
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
        };
      }, [activeTab, selectedElement]);

      return (
        <div className="w-screen h-screen flex flex-col font-sans select-none overflow-hidden">
          {/* Üst Başlık ve Sekmeler */}
          <header className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 z-10">
            <h1 className="text-lg font-bold bg-gradient-to-r from-sky-400 to-emerald-400 bg-clip-text text-transparent">
              3D Bilim Laboratuvarı & Simülasyon Ekranı
            </h1>
            <div className="flex gap-2">
              {[
                { id: 'lab', label: 'Kimya Lab' },
                { id: 'atom', label: 'Bohr Atom' },
                { id: 'earth', label: 'Dünya Manyetizma' },
                { id: 'nucleus', label: 'Hücre Çekirdeği' },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                    activeTab === tab.id
                      ? 'bg-sky-600 text-white shadow-lg shadow-sky-500/30'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </header>

          {/* 3D Görselleştirme Tuvali */}
          <div className="flex-1 relative flex">
            <div ref={canvasRef} className="w-full h-full" />

            {/* Bohr Atom Modülü Seçim Kutusu */}
            {activeTab === 'atom' && (
              <aside className="absolute right-6 top-6 w-72 bg-slate-900/90 backdrop-blur-md border border-slate-800 p-4 rounded-2xl shadow-2xl flex flex-col gap-3">
                <h2 className="text-sm font-bold text-slate-300 tracking-wider">ELEMENT SEÇİMİ</h2>
                <div className="grid grid-cols-4 gap-2 max-h-[60vh] overflow-y-auto pr-1">
                  {elements.map((el) => {
                    const isSelected = el.z === selectedZ;
                    return (
                      <button
                        key={el.z}
                        onClick={() => setSelectedZ(el.z)}
                        className={`p-2 rounded-xl border text-center transition-all ${
                          isSelected
                            ? 'border-sky-400 ring-2 ring-sky-400/50 bg-slate-800 scale-105'
                            : 'bg-slate-950/60 border-slate-800 hover:bg-slate-800'
                        }`}
                      >
                        <div className="text-[9px] text-slate-400 font-mono">{el.z}</div>
                        <div className="text-base font-black my-0.5" style={{ color: el.color }}>
                          {el.symbol}
                        </div>
                        <div className="text-[9px] text-slate-300 truncate">{el.name}</div>
                      </button>
                    );
                  })}
                </div>
              </aside>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
